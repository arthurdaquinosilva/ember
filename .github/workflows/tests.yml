name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: python -m pyflakes src tests
      - name: Test
        run: python -m pytest -q
      - name: Docs are up to date
        run: python scripts/gen_magic_docs.py --check
      - name: Install script
        run: |
          sh -n install.sh
          sh install.sh --help
